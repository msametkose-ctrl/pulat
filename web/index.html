<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulat — Tavla</title>
<style>
  :root {
    --bg: #1b1410; --panel: #2a1f18; --ink: #f3e9da; --muted: #b9a58c;
    --frame: #5b3a1e; --felt: #c9a46a; --pt-a: #f1e2c2; --pt-b: #8e2f1f;
    --white: #f7f2e8; --white-edge: #bfae92; --black: #1e1e1e; --black-edge: #5a5a5a;
    --accent: #f2b63d; --go: #57c27a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  svg { width: 100%; height: auto; display: block; border-radius: 10px; user-select: none; }
  .panel { background: var(--panel); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  .score { display: flex; justify-content: space-between; font-size: 26px; font-weight: 700; }
  .score small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .status { min-height: 44px; font-size: 16px; }
  .dice { display: flex; gap: 8px; min-height: 52px; }
  .die { width: 48px; height: 48px; border-radius: 9px; background: #fff; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 7px; box-shadow: 0 2px 0 #0006; }
  .die.ai { background: #222; }
  .die.used { opacity: .3; }
  .pip { width: 9px; height: 9px; border-radius: 50%; background: #222; place-self: center; }
  .die.ai .pip { background: #eee; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 11px 14px; cursor: pointer; background: var(--accent); color: #2a1a05; }
  button.sec { background: #4a3a2e; color: var(--ink); }
  button:disabled { opacity: .35; cursor: default; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .meter { height: 10px; background: #0005; border-radius: 5px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--go); width: 50%; transition: width .4s; }
  .log { font: 13px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); max-height: 220px; overflow: auto; margin: 0; padding: 0; list-style: none; }
  .log li b { color: var(--ink); font-weight: 600; }
  .muted { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <svg id="board" viewBox="0 0 890 580"></svg>
  <div class="panel">
    <h1>Pulat — tavla yapay zekâsı</h1>
    <label class="muted">Pulat'ın düşünme derinliği:
      <select id="depth" style="font:inherit;margin-left:6px;background:#4a3a2e;color:var(--ink);border:0;border-radius:6px;padding:4px 6px">
        <option value="2" selected>Derin (2 hamle ileriye bakar)</option>
        <option value="1">Hızlı (sadece sezgi)</option>
      </select></label>
    <div class="score"><div>Sen<small>beyaz</small><span id="sh">0</span></div><div style="text-align:right">Pulat<small>siyah</small><span id="sa">0</span></div></div>
    <div class="status" id="status">Başlamak için "Yeni oyun"a bas.</div>
    <div class="dice" id="dice"></div>
    <div class="btns">
      <button id="roll" disabled>Zar at</button>
      <button id="undo" class="sec" disabled>Geri al</button>
      <button id="pass" class="sec" style="display:none">Pas geç</button>
      <button id="new" class="sec">Yeni oyun</button>
    </div>
    <div>
      <div class="muted" style="margin-bottom:4px">Pulat'ın kazanma tahmini: <span id="wp">–</span></div>
      <div class="meter"><div id="wpbar"></div></div>
    </div>
    <ul class="log" id="log"></ul>
    <div class="muted" id="model"></div>
    <div class="muted">Pula tıkla, sonra gideceği yere tıkla. Tek gidebileceği yer varsa direkt gider. Pul toplarken sağdaki rafa tıkla.</div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const W = 60, L0 = 20, R0 = 430, R = 26;
let base = null, partial = [], seqs = [], dice = null, sel = null, phase = 'idle', diceOwner = 'human';

async function api(path, body = {}) {
  const r = await fetch('/api/' + path, { method: 'POST', body: JSON.stringify(body) });
  return r.json();
}

function applyMove(s, [f, t]) {
  s = s.slice();
  s[f] -= 1;
  if (t === -1) s[26] += 1;
  else { if (s[t] === -1) { s[t] = 0; s[25] += 1; } s[t] += 1; }
  return s;
}
const cur = () => partial.reduce(applyMove, base);
const same = (a, b) => a[0] === b[0] && a[1] === b[1];
function nextOpts() {
  const k = partial.length, out = [];
  for (const q of seqs) {
    if (partial.every((m, i) => same(m, q[i])) && q.length > k && !out.some(m => same(m, q[k]))) out.push(q[k]);
  }
  return out;
}

function px(p) {
  if (p <= 6) return R0 + (6 - p) * W;
  if (p <= 12) return L0 + (12 - p) * W;
  if (p <= 18) return L0 + (p - 13) * W;
  return R0 + (p - 19) * W;
}

function draw() {
  const s = base ? cur() : null;
  const opts = phase === 'move' ? nextOpts() : [];
  const sources = new Set(opts.map(m => m[0]));
  const targets = sel === null ? new Set() : new Set(opts.filter(m => m[0] === sel).map(m => m[1]));
  let g = `<rect width="890" height="580" fill="var(--frame)"/>
    <rect x="${L0}" y="20" width="360" height="540" fill="var(--felt)"/>
    <rect x="${R0}" y="20" width="360" height="540" fill="var(--felt)"/>
    <rect x="800" y="20" width="70" height="265" rx="4" fill="#3c2614"/>
    <rect x="800" y="295" width="70" height="265" rx="4" fill="${targets.has(-1) ? '#2e6b45' : '#3c2614'}"/>`;
  for (let p = 1; p <= 24; p++) {
    const x = px(p), top = p >= 13, col = p % 2 ? 'var(--pt-b)' : 'var(--pt-a)';
    const tip = top ? 250 : 330, b = top ? 20 : 560;
    g += `<polygon points="${x},${b} ${x + W},${b} ${x + W / 2},${tip}" fill="${col}"/>`;
    if (targets.has(p - 1)) g += `<polygon points="${x},${b} ${x + W},${b} ${x + W / 2},${tip}" fill="var(--go)" opacity=".75"/>`;
    g += `<text x="${x + W / 2}" y="${top ? 14 : 574}" font-size="11" text-anchor="middle" fill="#e9d6b8">${p}</text>`;
  }
  if (s) {
    for (let i = 0; i < 24; i++) {
      const n = Math.abs(s[i]); if (!n) continue;
      const p = i + 1, cx = px(p) + W / 2, top = p >= 13, mine = s[i] > 0;
      for (let k = 0; k < Math.min(n, 5); k++) {
        const cy = top ? 46 + k * 50 : 534 - k * 50;
        g += checker(cx, cy, mine, mine && sources.has(i) && k === Math.min(n, 5) - 1, sel === i && k === Math.min(n, 5) - 1);
        if (k === 4 && n > 5) g += `<text x="${cx}" y="${cy + 6}" font-size="18" font-weight="700" text-anchor="middle" fill="${mine ? '#222' : '#eee'}">${n}</text>`;
      }
    }
    for (let k = 0; k < s[24]; k++) g += checker(405, 240 - k * 44, true, sources.has(24) && k === s[24] - 1, sel === 24 && k === s[24] - 1);
    for (let k = 0; k < s[25]; k++) g += checker(405, 340 + k * 44, false);
    for (let k = 0; k < s[26]; k++) g += `<rect x="806" y="${548 - k * 17}" width="58" height="13" rx="3" fill="var(--white)" stroke="var(--white-edge)"/>`;
    for (let k = 0; k < s[27]; k++) g += `<rect x="806" y="${26 + k * 17}" width="58" height="13" rx="3" fill="var(--black)" stroke="var(--black-edge)"/>`;
  }
  for (let i = 0; i < 24; i++) {
    const p = i + 1;
    g += `<rect data-i="${i}" x="${px(p)}" y="${p >= 13 ? 20 : 290}" width="${W}" height="270" fill="transparent" style="cursor:pointer"/>`;
  }
  g += `<rect data-i="24" x="380" y="20" width="50" height="270" fill="transparent" style="cursor:pointer"/>`;
  g += `<rect data-i="-1" x="800" y="295" width="70" height="265" fill="transparent" style="cursor:pointer"/>`;
  $('board').innerHTML = g;
  drawDice();
  $('undo').disabled = !(phase === 'move' && partial.length);
}

function checker(cx, cy, mine, glow, chosen) {
  const fill = mine ? 'var(--white)' : 'var(--black)', edge = mine ? 'var(--white-edge)' : 'var(--black-edge)';
  let h = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${fill}" stroke="${edge}" stroke-width="2"/>
           <circle cx="${cx}" cy="${cy}" r="${R - 9}" fill="none" stroke="${edge}" stroke-width="1.5" opacity=".6"/>`;
  if (glow || chosen) h += `<circle cx="${cx}" cy="${cy}" r="${R + 3}" fill="none" stroke="${chosen ? 'var(--go)' : 'var(--accent)'}" stroke-width="4"/>`;
  return h;
}

const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function drawDice() {
  if (!dice) { $('dice').innerHTML = ''; return; }
  const list = dice[0] === dice[1] ? [dice[0], dice[0], dice[0], dice[0]] : [dice[0], dice[1]];
  const used = list.map(() => false);
  if (diceOwner === 'human') for (const [f, t] of partial) {
    const dist = t === -1 ? f + 1 : (f === 24 ? 24 : f) - t;
    let j = list.findIndex((d, i) => !used[i] && d === dist);
    if (j < 0) { let best = -1; list.forEach((d, i) => { if (!used[i] && d >= dist && (best < 0 || d < list[best])) best = i; }); j = best; }
    if (j >= 0) used[j] = true;
  }
  $('dice').innerHTML = list.map((d, i) => `<div class="die ${diceOwner === 'ai' ? 'ai' : ''} ${used[i] ? 'used' : ''}">` +
    Array.from({ length: 9 }, (_, k) => PIPS[d].includes(k) ? '<div class="pip"></div>' : '<div></div>').join('') + '</div>').join('');
}

function status(t) { $('status').innerHTML = t; }
function log(who, txt) { $('log').insertAdjacentHTML('afterbegin', `<li><b>${who}</b> ${txt}</li>`); }
function setScore(sc) { $('sh').textContent = sc[0]; $('sa').textContent = sc[1]; }
const fmt = ([f, t]) => `${f === 24 ? 'bar' : f + 1}/${t === -1 ? 'off' : t + 1}`;

function endGame(r) {
  phase = 'over'; setScore(r.score);
  status(r.winner === 'human' ? `🎉 <b>Kazandın!</b> ${r.points === 2 ? 'MARS — 2 puan' : '1 puan'}` : `Pulat kazandı ${r.points === 2 ? '— MARS, 2 puan' : '— 1 puan'}`);
  $('roll').disabled = true;
}

$('board').addEventListener('click', e => {
  const el = e.target.closest('[data-i]');
  if (!el || phase !== 'move') return;
  const i = +el.dataset.i, opts = nextOpts();
  if (sel !== null) {
    const m = opts.find(m => m[0] === sel && m[1] === i);
    if (m) return doMove(m);
  }
  const mine = opts.filter(m => m[0] === i);
  if (!mine.length) { sel = null; draw(); return; }
  const tgts = [...new Set(mine.map(m => m[1]))];
  if (tgts.length === 1) return doMove(mine[0]);
  sel = i; draw();
});

function doMove(m) {
  partial.push(m); sel = null;
  if (!nextOpts().length) return submit();
  autoSelect(); draw();
}
function autoSelect() {
  const src = [...new Set(nextOpts().map(m => m[0]))];
  sel = src.length === 1 ? src[0] : null;
}

async function submit() {
  phase = 'wait'; draw();
  const r = await api('play', { moves: partial });
  if (r.error) { status(r.error); partial = []; phase = 'move'; draw(); return; }
  if (partial.length) log('Sen', `${dice[0]}-${dice[1]}: ${partial.map(fmt).join(' ')}`);
  base = r.state; partial = []; seqs = [];
  if (r.winner) { draw(); return endGame(r); }
  draw(); aiTurn();
}

async function aiTurn() {
  phase = 'ai'; status('Pulat düşünüyor…'); $('roll').disabled = true; $('pass').style.display = 'none';
  await new Promise(r => setTimeout(r, 400));
  const r = await api('ai', { depth: +$('depth').value });
  dice = r.dice; diceOwner = 'ai'; draw();
  for (const fr of r.frames) { await new Promise(res => setTimeout(res, 380)); base = fr; draw(); }
  base = r.state; draw();
  log('Pulat', `${r.dice[0]}-${r.dice[1]}: ${r.moves.length ? r.moves.map(m => m.join('/')).join(' ') : '(oynayamadı)'}`);
  const wp = Math.round(r.win_prob * 100);
  $('wp').textContent = `%${wp}` + (r.gammon_prob > 0.15 ? ` (mars ihtimali %${Math.round(r.gammon_prob * 100)})` : '');
  $('wpbar').style.width = wp + '%';
  if (r.winner) return endGame(r);
  phase = 'roll'; status('Senin sıran — zar at.'); $('roll').disabled = false;
}

$('roll').onclick = async () => {
  if (phase !== 'roll') return;
  $('roll').disabled = true;
  const r = await api('roll');
  dice = r.dice; diceOwner = 'human'; seqs = r.seqs; base = r.state; partial = []; sel = null;
  if (!seqs.length) {
    phase = 'nomove'; draw();
    status(`${dice[0]}-${dice[1]} attın — oynayacak hamlen yok.`);
    $('pass').style.display = '';
    return;
  }
  phase = 'move'; autoSelect(); draw();
  status(`${dice[0]}-${dice[1]} attın — pulunu oyna.`);
};
$('pass').onclick = () => { $('pass').style.display = 'none'; partial = []; submit(); };
$('undo').onclick = () => { partial.pop(); autoSelect(); draw(); };
$('new').onclick = async () => {
  const r = await api('new');
  base = r.state; partial = []; seqs = []; dice = null; sel = null; setScore(r.score);
  $('log').innerHTML = ''; $('wp').textContent = '–'; $('wpbar').style.width = '50%';
  $('model').textContent = `Model: ${r.model} — ${r.games.toLocaleString('tr-TR')} oyunluk deneyim`;
  draw();
  if (r.first === 'ai') { status('Pulat başlıyor…'); aiTurn(); }
  else { phase = 'roll'; status('Sen başlıyorsun — zar at.'); $('roll').disabled = false; }
};
document.addEventListener('keydown', e => { if (e.code === 'Space' && phase === 'roll') { e.preventDefault(); $('roll').click(); } });
draw();
</script>
</body>
</html>
